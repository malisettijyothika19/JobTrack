<!DOCTYPE html>
<html>
<head>
    <title>Edit Job - JobTrack</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="form-container">

    <div class="form-header">
        <h1>✏️ Edit Job Application</h1>
        <p>Update your job application details</p>
    </div>

    <form method="POST">

        <div class="form-group">
            <label>Company</label>

            <input type="text"
                   name="company"
                   value="{{ job['company'] }}"
                   required>
        </div>


        <div class="form-group">
            <label>Job Position</label>

            <input type="text"
                   name="position"
                   value="{{ job['position'] }}"
                   required>
        </div>

        <div class="form-group">
            <label for="job_url">Job URL</label>
            <input type="url"
                    id="job_url"
                    name="job_url"
                    value="{{ job['job_url'] or '' }}"
                    placeholder="https://example.com/job"
                    required>
        </div>


        <div class="form-group">
            <label>Status</label>

            <select name="status" required>

                <option value="Applied"
                    {% if job['status'] == 'Applied' %}selected{% endif %}>
                    Applied
                </option>

                <option value="Interview"
                    {% if job['status'] == 'Interview' %}selected{% endif %}>
                    Interview
                </option>

                <option value="Selected"
                    {% if job['status'] == 'Selected' %}selected{% endif %}>
                    Selected
                </option>

                <option value="Rejected"
                    {% if job['status'] == 'Rejected' %}selected{% endif %}>
                    Rejected
                </option>

            </select>
        </div>


        <div class="form-group">
            <label>Application Date</label>

            <input type="date"
                   name="application_date"
                   value="{{ job['application_date'] }}"
                   required>
        </div>


        <button type="submit" class="submit-btn">
            💾 Update Application
        </button>

    </form>


    <a href="/" class="back-link">
        ← Back to Job Applications
    </a>

</div>

</body>
</html>
